;title='Settings'
;creator='Kefir Team'
;version='1.0'
;color='green'

[Overclock status]
;mode=toggle
on:
try:
notify-now 'Enabling Overclock...'
copy /config/oc/atmosphere/ /
copy /config/oc/bootloader/ /
copy /config/oc/switch/.overlays/sys-clk-overlay.ovl /switch/.overlays/sys-clk-overlay.ovl
copy /config/oc/config/ /
move /config/oc_bkp/config/sys-clk/config.ini /config/sys-clk/config.ini
reboot
off:
try:
notify-now 'Disabling Overclock...'
delete /atmosphere/contents/00FF0000636C6BFF/
delete /atmosphere/kips/kefir.kip
delete /bootloader/loader.kip
delete /switch/.overlays/sys-clk-overlay.ovl
move /config/sys-clk/config.ini /config/oc_bkp/config/sys-clk/config.ini
reboot

[40mb memory on FW20+ status]
;mode=toggle
on:
try:
notify-now 'Enabling 40MB memory patch...'
set-ini-val /atmosphere/config/system_settings.ini 'atmosphere' force_40mb_applet 1
off:
try:
notify-now 'Disabling 40MB memory patch...'
set-ini-val /atmosphere/config/system_settings.ini 'atmosphere' force_40mb_applet 0

[8GB DRAM status]
;mode=toggle
;hold=true
;info=WARNING: Only for consoles with 8GB RAM! Press again to disable.
on:
try:
notify-now 'Enabling 8GB DRAM Mode...'
copy '/config/8gb/install.te' '/startup.te'
copy '/bootloader/payloads/TegraExplorer.bin' '/payload.bin'
reboot
off:
try:
notify-now 'Disabling 8GB DRAM Mode...'
copy '/tegraexplorer/scripts/Remove_8GB-RAM_config.te' '/startup.te'
copy '/bootloader/payloads/TegraExplorer.bin' '/payload.bin'
reboot

[*Fan Control]
;mode=forwarder
package_source './Fan Control/package.ini'
