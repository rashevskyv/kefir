[on-boot]
; kefir-safemode-begin
try:
path_exists /config/kefir/safemode_notice.flag
notify-now "Безпечний режим: модулі та моди вимкнено. Оновіть Kefir у Kefir Hub. / Safe mode: modules and mods are off. Update Kefir in Kefir Hub." 26 center word 0 "Kefir" false kefir
delete /config/kefir/safemode_notice.flag
; kefir-safemode-end
