;title='Kefir Menu'
;creator='Kefir Team'
;version='1.0'
;color='green'

[Settings]
;mode=forwarder
package_source './Settings/package.ini'

[Software]
;mode=forwarder
package_source './Software/package.ini'

[Theme]
;mode=forwarder
package_source './Theme/package.ini'

[Translate Interface]
;mode=forwarder
package_source './Translate Interface/package.ini'

[Semi-Stock Status]
;hold=true
;mode=toggle
toggle_visibility file_exists /emummc/emummc.ini
toggle_state ini_val /emummc/emummc.ini 'emummc' enabled 0
on:
try:
notify-now 'Enabling Semi-Stock...'
mkdir /config/semistock
mkdir /tegraexplorer
mkdir /tegraexplorer/scripts
copy /emummc/emummc.ini /config/semistock/emummc.ini.bkp
copy /exosphere.ini /config/semistock/exosphere.ini.bkp
copy /config/semistock/restore.te /tegraexplorer/scripts/Return_to_emuMMC.te
path_exists /config/semistock/emummc.ini.bkp
path_exists /config/semistock/exosphere.ini.bkp
path_exists /tegraexplorer/scripts/Return_to_emuMMC.te
set-ini-val /emummc/emummc.ini 'emummc' enabled 0
set-ini-val /exosphere.ini 'exosphere' blank_prodinfo_sysmmc 0
move /atmosphere/contents/0100000000001000/romfs/lyt /config/ultrahand/romfs/lyt
reboot
off:
try:
notify-now 'Returning to Kefir...'
set-ini-val /emummc/emummc.ini 'emummc' enabled 1
set-ini-val /exosphere.ini 'exosphere' blank_prodinfo_sysmmc 1
copy /config/semistock/emummc.ini.bkp /emummc/emummc.ini
copy /config/semistock/exosphere.ini.bkp /exosphere.ini
move /config/ultrahand/romfs/lyt /atmosphere/contents/0100000000001000/romfs/lyt
delete /config/ultrahand/romfs
delete /tegraexplorer/scripts/Return_to_emuMMC.te
delete /config/semistock/emummc.ini.bkp
delete /config/semistock/exosphere.ini.bkp
reboot

[Shutdown]
;hold=true
try:
notify-now 'Shutting down...'
shutdown

[Reboot]
;hold=true
try:
notify-now 'Rebooting...'
reboot
